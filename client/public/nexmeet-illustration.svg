<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NexMeet video call illustration</title>
  <desc id="desc">Two friendly people wave from a video call window.</desc>
  <defs>
    <linearGradient id="window" x1="90" y1="54" x2="440" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294B43"/>
      <stop offset="1" stop-color="#173B35"/>
    </linearGradient>
    <linearGradient id="tileA" x1="130" y1="115" x2="280" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE9D8"/>
      <stop offset="1" stop-color="#B8D0C0"/>
    </linearGradient>
    <linearGradient id="tileB" x1="285" y1="115" x2="430" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E4D3"/>
      <stop offset="1" stop-color="#E8C9B4"/>
    </linearGradient>
    <filter id="shadow" x="34" y="30" width="492" height="330" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <style>
      .float { animation: float 5s ease-in-out infinite; transform-origin: 280px 180px; }
      .wave { animation: wave 1.8s ease-in-out infinite; transform-origin: 190px 192px; }
      .wave2 { animation: wave 2.2s ease-in-out infinite .25s; transform-origin: 376px 190px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .bar1 { animation: bars .7s ease-in-out infinite alternate; }
      .bar2 { animation: bars .7s ease-in-out .2s infinite alternate; }
      .bar3 { animation: bars .7s ease-in-out .4s infinite alternate; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
      @keyframes wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-18deg); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
      @keyframes bars { from { transform: scaleY(.45); } to { transform: scaleY(1.3); } }
    </style>
  </defs>

  <ellipse cx="282" cy="305" rx="205" ry="24" fill="#607D6A" opacity=".13" filter="url(#shadow)"/>
  <path d="M55 175c-4-64 45-116 109-119 39-2 62 18 95 10 56-14 92-42 151-17 54 23 79 78 65 132-14 54-63 74-112 89-74 23-146 27-215 7-55-16-89-49-93-102Z" fill="#DCE9D5" opacity=".72"/>
  <path d="M430 72c19-17 42-22 62-12" stroke="#176F5D" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" opacity=".65"/>
  <path d="m477 49 20 9-17 13" stroke="#176F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="float">
    <rect x="65" y="48" width="430" height="266" rx="28" fill="#173B35" opacity=".14" filter="url(#shadow)"/>
    <rect x="76" y="42" width="408" height="262" rx="24" fill="url(#window)"/>
    <path d="M100 42h360a24 24 0 0 1 24 24v22H76V66a24 24 0 0 1 24-24Z" fill="#203F39"/>
    <circle cx="101" cy="66" r="5" fill="#E98A70"/>
    <circle cx="119" cy="66" r="5" fill="#E4BC78"/>
    <circle cx="137" cy="66" r="5" fill="#83B397"/>
    <text x="280" y="69" fill="#D9E5DB" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3">NEXMEET  /  LIVE ROOM</text>
    <circle cx="451" cy="66" r="4" fill="#E98A70" class="pulse"/>

    <rect x="94" y="100" width="181" height="150" rx="15" fill="url(#tileA)"/>
    <rect x="285" y="100" width="181" height="150" rx="15" fill="url(#tileB)"/>

    <!-- Person one -->
    <circle cx="184" cy="157" r="31" fill="#49362F"/>
    <path d="M151 157c0-25 14-41 33-41 22 0 36 17 34 43-9-11-18-16-31-16-14 0-24 5-36 14Z" fill="#49362F"/>
    <ellipse cx="184" cy="164" rx="25" ry="30" fill="#D99A78"/>
    <path d="M173 162h1m20 0h1" stroke="#503A34" stroke-width="4" stroke-linecap="round"/>
    <path d="M178 176c4 4 9 4 13 0" stroke="#9B574C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M143 250c4-37 20-55 41-55s38 18 42 55" fill="#176F5D"/>
    <path d="M167 205c4 8 10 12 17 12s13-4 17-12" stroke="#F3E9D8" stroke-width="3" stroke-linecap="round"/>
    <g class="wave">
      <path d="M145 164c-12-7-16-20-12-34 3-8 10-12 16-9 7 3 7 12 3 20l-4 23Z" fill="#D99A78"/>
      <path d="M135 139l-8-9m13 3-3-12m11 12 3-11" stroke="#D99A78" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Person two -->
    <circle cx="375" cy="157" r="31" fill="#49362F"/>
    <path d="M342 158c-2-25 13-42 34-42 24 0 38 18 35 45-8-12-19-18-35-18-13 0-24 5-34 15Z" fill="#49362F"/>
    <ellipse cx="376" cy="164" rx="24" ry="29" fill="#E8B18E"/>
    <path d="M365 162h1m19 0h1" stroke="#503A34" stroke-width="4" stroke-linecap="round"/>
    <path d="M369 176c4 4 9 4 13 0" stroke="#9B574C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M335 250c4-37 20-55 41-55s38 18 42 55" fill="#E58B70"/>
    <g class="wave2">
      <path d="M408 166c12-7 16-20 12-34-3-8-10-12-16-9-7 3-7 12-3 20l4 23Z" fill="#E8B18E"/>
      <path d="m418 139 8-9m-13 3 3-12m-11 12-3-11" stroke="#E8B18E" stroke-width="5" stroke-linecap="round"/>
    </g>

    <path d="M94 266h372" stroke="#45645A" stroke-width="1"/>
    <g transform="translate(194 274)">
      <circle cx="0" cy="0" r="14" fill="#315B50"/>
      <path d="M-3-5v7a3 3 0 0 0 6 0v-7a3 3 0 0 0-6 0Zm-5 6a8 8 0 0 0 16 0m-8 8v4m-5 0h10" stroke="#F8F7EF" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="48" cy="0" r="14" fill="#315B50"/>
      <path d="m42-5 12-4v18l-12-4V-5Z" stroke="#F8F7EF" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="96" cy="0" r="14" fill="#E77F68"/>
      <path d="m90-5 12 10m0-10L90 5" stroke="#FFF9F1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="144" cy="0" r="14" fill="#315B50"/>
      <circle cx="138" cy="0" r="1.4" fill="#FFF9F1"/>
      <circle cx="144" cy="0" r="1.4" fill="#FFF9F1"/>
      <circle cx="150" cy="0" r="1.4" fill="#FFF9F1"/>
    </g>
  </g>

  <g class="pulse">
    <path d="M48 116l-12-10m21 1-4-15m15 17 7-12" stroke="#176F5D" stroke-width="4" stroke-linecap="round"/>
    <path d="M502 232l12-8m-7 21 15 2" stroke="#E58B6D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(443 14)">
    <rect width="78" height="38" rx="19" fill="#FFFEFA" stroke="#E6E9E2"/>
    <circle cx="18" cy="19" r="4" fill="#E58B6D"/>
    <path d="M32 19h28" stroke="#718078" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(24 282)">
    <rect width="108" height="36" rx="18" fill="#FFFEFA" stroke="#E6E9E2"/>
    <path d="M17 18h16m-8-8v16" stroke="#176F5D" stroke-width="2" stroke-linecap="round"/>
    <text x="43" y="22" fill="#59665F" font-family="Arial,sans-serif" font-size="10">say hello</text>
  </g>
</svg>
